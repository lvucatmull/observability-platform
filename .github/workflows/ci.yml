name: Observability platform CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  config-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install replay build dependencies
        run: npm ci

      - name: Install E2E browser
        run: npx playwright install --with-deps chromium

      - name: Generate isolated CI configuration
        run: npm run setup

      - name: Validate contracts and configuration
        run: npm test

      - name: Start the stack
        run: docker compose up -d --build

      - name: Verify ingestion and provisioned dashboard
        run: npm run smoke

      - name: Verify replay recording and playback
        run: npm run e2e

      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
