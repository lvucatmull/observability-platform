name: observability-platform

services:
  loki:
    image: grafana/loki:3.7.2
    command: ["-config.file=/etc/loki/local-config.yml"]
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/config.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.18.0
    command:
      - run
      - --stability.level=experimental
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    ports:
      - "127.0.0.1:${ALLOY_UI_PORT:-12345}:12345"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    depends_on:
      - loki
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?run npm run setup first}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_SERVER_ROOT_URL: "http://127.0.0.1:${GRAFANA_PORT:-3200}"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3200}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  alloy-data:
  grafana-data:
  loki-data:
